name: Gitnotate V3-C web local

on:
  pull_request:
    branches: [feat/v3-catalogue-signets-20261120]

permissions:
  contents: read

jobs:
  web-and-regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-web-v3.txt -r requirements-web-dev-v3.txt
      - name: Check Python syntax
        run: python -m compileall -q catalogue_v3.py web_v3.py scripts/lancer_web_v3.py tests
      - name: Check browser JS syntax
        run: node --check web_v3_assets/app.js
      - name: Full offline suite Linux (including strict performance benchmark)
        if: runner.os != 'Windows'
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: python -m pytest -q
      - name: Full offline suite Windows (functional assertions)
        if: runner.os == 'Windows'
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: python -m pytest -q -k "not test_performance"
      - name: Legacy performance benchmark Windows in a fresh process (one retry)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: |
          python -m pytest -q tests/test_redecouverte_recherche.py::test_performance
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Rerun isolated legacy benchmark once after a hosted-runner timing fluctuation'
            python -m pytest -q tests/test_redecouverte_recherche.py::test_performance
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
