name: Validation Gitnotate (Python Windows/Linux)

on:
  pull_request:
    branches: [claude/amazing-dijkstra-w25nu2, feat/v3-catalogue-signets-20261120, feat/v3-web-local-20261120]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-web.txt
      - name: Check Python syntax
        run: python -m compileall -q gitnotate.py redecouverte.py scripts/check_llm.py catalogue_v3.py avis_v3.py ai_settings_v3.py web_v3.py tests
      - name: Check local frontend JavaScript syntax
        run: node --check web_v3/app.js
      - name: Run isolated test suite (no real keys or Notion changes)
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: python -m pytest -q
      # INSTRUMENTATION EXPÉRIMENTALE (branche exp/bench-budget-2p5-20261123 uniquement, jamais destinée à la PR #9) :
      # la suite ci-dessus reste inchangée et bloquante ; cette étape relance seulement le benchmark dans 5 processus
      # indépendants pour relever les durées (lignes BENCH), sans décider du statut du job.
      - name: Experimental benchmark distribution (5 separate processes, diagnostic only)
        if: always()
        shell: bash
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: |
          for i in 1 2 3 4 5; do
            echo "=== benchmark process $i ==="
            python -m pytest -q -p no:cacheprovider tests/test_redecouverte_recherche.py::test_performance || echo "BENCH_FAIL process $i"
          done
