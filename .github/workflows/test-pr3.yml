name: Validation Gitnotate (PR #3)

on:
  pull_request:
    branches: [claude/amazing-dijkstra-w25nu2, feat/v3-catalogue-signets-20261120]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-web.txt
      - name: Check Python syntax
        run: python -m compileall -q gitnotate.py redecouverte.py scripts/check_llm.py catalogue_v3.py web_v3.py tests
      - name: Run isolated test suite (no real keys or Notion changes)
        env:
          GITNOTATE_NO_DOTENV: '1'
        run: python -m pytest -q
